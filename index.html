<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>내 문서</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <!-- 기본 깔끔한 스타일 테마 -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: 'WINTER_GUIDE', // 좌측 상단 타이틀
      homepage: 'index.md', // 이 라인을 추가하세요!
      loadSidebar: true,       // 사이드바 목차 사용 설정
      subMaxLevel: 3           // index.md 안의 #, ##, ### 제목을 읽어 자동으로 사이드바 목차로 만듦
    }
  </script>
  <!-- Docsify 핵심 라이브러리 -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
</body>
</html>
