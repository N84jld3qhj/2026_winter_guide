<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>{{ page.title }}</title>
  <style>
    /* 전체 레이아웃 (사이드바 + 본문) */
    .docs-container {
      display: flex;
      gap: 40px;
      max-width: 1000px;
      margin: 0 auto;
      padding: 20px;
    }
    
    /* 왼쪽 고정 목차 사이드바 */
    .docs-sidebar {
      position: sticky;
      top: 20px;
      width: 220px;
      flex-shrink: 0;
      max-height: calc(100vh - 40px);
      overflow-y: auto;
      font-size: 0.9em;
      padding-right: 15px;
      border-right: 1px solid #e1e4e8;
    }
    
    /* 오른쪽 본문 영역 */
    .docs-content {
      flex-grow: 1;
      min-width: 0;
    }
  </style>
</head>
<body>

<div class="docs-container">
  <!-- 왼쪽 고정 목차 영역 -->
  <div class="docs-sidebar">
    <h3>목차</h3>
    {{ content | toc }}
  </div>

  <!-- 오른쪽 본문 마크다운 출력 영역 -->
  <div class="docs-content">
    {{ content }}
  </div>
</div>

</body>
</html>
